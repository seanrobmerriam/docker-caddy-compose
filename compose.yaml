name: docker-caddy-astro

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      astro:
        condition: service_healthy
      next:
        condition: service_healthy
    restart: unless-stopped

  astro:
    build:
      context: ./app
      args:
        PNPM_VERSION: ${PNPM_VERSION:-10.12.4}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:local-development-password@postgres:5432/app}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-app}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  next:
    build:
      context: ./next
      args:
        PNPM_VERSION: ${PNPM_VERSION:-10.12.4}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  rustfs-permissions:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - rustfs_data:/rustfs-data
    command: ["sh", "-ec", "chown -R 10001:10001 /rustfs-data"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:9000/health/ready && curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:9001/rustfs/console/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  toolchain:
    profiles: [tools]
    build:
      context: ./toolchain
      args:
        WASMTIME_VERSION: ${WASMTIME_VERSION:-47.0.3}
    volumes:
      - ./workspace:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    stdin_open: true
    tty: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rustfs_data:
  cargo_registry:
  cargo_git:
